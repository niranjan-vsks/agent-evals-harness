# Serves the Vite build and proxies /api/* to the API with the prefix stripped (cards/P4.md section 1).
#
# The upstream is resolved per request (Docker's embedded DNS at 127.0.0.11) instead of once at start:
# `docker compose up -d --build api` gives the api container a new address, and a name resolved at start
# would keep answering 502 until web is restarted. It also lets web start before api is reachable.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # An experiment page can wait on a bootstrap with 10,000 resamples; do not cut it off at 60 s.
        proxy_read_timeout 300s;
        # CSV and JSON exports are streamed through unchanged, with the API's Content-Disposition.
        proxy_buffering off;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # vue-router uses history mode: any other path is the app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
