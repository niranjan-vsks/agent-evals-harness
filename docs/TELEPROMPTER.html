<!doctype html><html><head><meta charset="utf-8"><title>Teleprompter</title>
<style>
:root{--bg:#0b1220;--s1:#111a2e;--bd:#243049;--tx:#e6edf7;--mu:#8b9bb4;--ac:#22b8f0;--ok:#2ecc8a;--wa:#f5b942;--fa:#ff5c6c}
html,body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 Inter,system-ui,sans-serif;height:100%}
#top{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;border-bottom:1px solid var(--bd);font-size:15px;color:var(--mu)}
#clock{font:600 28px ui-monospace,monospace;color:var(--tx)} #clock.over{color:var(--fa)}
#card{max-width:1100px;margin:36px auto;padding:0 28px}
.sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin-bottom:10px}
.title{font-size:44px;font-weight:600;line-height:1.15;margin:0 0 14px}
.box{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:18px 22px;margin:14px 0}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.open .lbl{color:var(--wa)} .do .lbl{color:var(--ac)} .say .lbl{color:var(--ok)}
.cue{font:600 24px/1.35 ui-monospace,monospace;margin:4px 0}
.say p{font-size:30px;line-height:1.45;margin:0}
.pause{color:var(--wa);font-size:20px}
#nav{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:var(--mu);font-size:14px}
.pill{display:inline-block;padding:2px 10px;border:1px solid var(--bd);border-radius:999px;margin-right:8px}
.big{font-size:22px;color:var(--mu);margin-top:4px}
</style></head><body>
<div id="top"><div><span class="pill" id="pos"></span><span id="secname"></span> · target start <b id="tstart"></b></div><div id="clock">00:00</div></div>
<div id="card"></div>
<div id="nav">→ or Space: next · ← back · S: start/stop clock · R: reset clock · Home: first card</div>
<script>
const CARDS=[{"section": "Intro", "start": "0:00", "length": "0:30", "kind": "section"}, {"section": "Intro", "start": "0:00", "kind": "do", "cues": [{"t": "do", "c": "CAMERA ON if you are using it"}, {"t": "open", "c": "DECK: the Welcome slide on screen, do not advance yet"}], "text": "Hi, I'm Niranjan. I'm a senior forward deployed AI engineer, 7 plus years building production AI systems, and the last 4 of those on agentic and GenAI systems end to end. I don't only build the agent. I own the harness around it: the evaluation, the observability, the quality bar it gets judged against. So when this assignment arrived, it was, honestly, a description of my job: take a harness and a model, change 1 thing, and answer whether the agent got better, worse, or stayed the same, and how sure we are."}, {"section": "Intro", "start": "0:00", "kind": "do", "cues": [{"t": "pause", "c": "PAUSE 1s"}]}, {"section": "The result, in 1 breath", "start": "0:30", "length": "0:15", "kind": "section"}, {"section": "The result, in 1 breath", "start": "0:30", "kind": "do", "cues": [{"t": "open", "c": "NEXT SLIDE: the question and the answer"}], "text": "So I picked 1 such question to put the platform through. Does giving the agent a memory file make it better, or is the improvement luck? Here is what came out. On 22 tasks, Hermes with seeded memory passed 0.894 against 0.561 without it. That is a difference of minus 0.333, with a 95 percent interval from minus 0.515 to minus 0.167. The rest of this video is how the platform gets to that number, and where it stops trusting itself."}, {"section": "Deck", "start": "0:45", "length": "1:45", "kind": "section"}, {"section": "Deck", "start": "0:45", "kind": "do", "cues": [{"t": "open", "c": "NEXT SLIDE: the problem"}], "text": "The usual evidence for 'this change made the agent better' is 1 run and 1 score, with no error bar. Agents are not deterministic, so a single run cannot separate a real change from noise. This platform asks a narrower question: on the same tasks, does config A beat config B, and is the difference bigger than the noise?"}, {"section": "Deck", "start": "0:45", "kind": "do", "cues": [{"t": "pause", "c": "PAUSE 1s"}, {"t": "open", "c": "NEXT SLIDE: architecture. The numbered badges appear in the order you say them; pace each step to its badge"}], "text": "4 containers, and 1 cycle that every trial goes through. Step 1: in the interface I define a config, which is a harness plus a model plus settings. Step 2: the API turns an experiment into trials, every task under every config, N times each, and schedules them with retries. Step 3: the worker starts a fresh process for each trial, as an unprivileged user. Step 4: that process talks to the harness only through 1 adapter contract. 2 harnesses sit behind it: Hermes, and a small loop I wrote after freezing the contract, to prove the contract is not shaped like Hermes. Step 5: the harness calls the model through OpenRouter, so a model is a registry row. Step 6: when the agent exits, the graders run on what it left behind. Step 7: the trace, the token usage and the grades go back to the API, which is where the statistics live. Then the loop repeats for the next trial."}, {"section": "Deck", "start": "0:45", "kind": "do", "cues": [{"t": "open", "c": "NEXT SLIDE: the statistical approach, let it build"}], "text": "Each task runs 3 times per config, which gives a pass rate per task. I take the difference task by task, so task difficulty cancels, average it, and resample the 22 tasks 10,000 times to get an interval. The rule is fixed in code: if the interval contains zero, the verdict is noise."}, {"section": "Deck", "start": "0:45", "kind": "do", "cues": [{"t": "open", "c": "NEXT SLIDE: the judge gate"}], "text": "5 tasks produce prose, so a second model judges them. I labelled all 30 of those trials blind. Kappa came out at 0.64, with an interval from 0.32 to 0.90. That passes the 0.6 line I set beforehand, so the judged tasks count."}, {"section": "Deck", "start": "0:45", "kind": "do", "cues": [{"t": "open", "c": "NEXT SLIDE: the result, let the bars draw"}], "text": "The result. Memory-dependent tasks: 0 of 18 trials without memory, 17 of 18 with it. Every other group contains zero. So the claim is narrow: memory helped on tasks written to need it, and did no harm on the rest of this set. That is the deck. Everything else is the running system, starting with how it comes up."}, {"section": "Setup: 1 command, 4 containers", "start": "2:30", "length": "0:15", "kind": "section"}, {"section": "Setup: 1 command, 4 containers", "start": "2:30", "kind": "do", "cues": [{"t": "open", "c": "SWITCH TO TERMINAL: the repo folder, `docker compose ps` already typed"}, {"t": "do", "c": "PRESS ENTER"}], "text": "Setup is 1 command, docker compose up, with the API key in a dot env file. 4 containers: database, API, worker, web. The README covers adding a task, a harness and a model."}, {"section": "Overview", "start": "2:45", "length": "0:45", "kind": "section"}, {"section": "Overview", "start": "2:45", "kind": "do", "cues": [{"t": "open", "c": "SWITCH TO BROWSER: http://localhost:8280/"}, {"t": "pause", "c": "PAUSE 2s while the numbers count in"}], "text": "This is the home screen. 3 experiments, 268 trials, none errored, 0.11 dollars of agent model spend, which is a floor. The best pass rate on the board is 0.894, and it belongs to the memory-seeded config."}, {"section": "Overview", "start": "2:45", "kind": "do", "cues": [{"t": "do", "c": "POINT: Latest verdicts"}], "text": "Each stored comparison shows its interval and verdict. The memory experiment: seeded better, minus 0.333. The other row compares 2 models. It reads 'A better', but I treat it as no reliable difference: it leans on judged tasks graded by one of the models being compared, and on 3 trials that read a grader file before I closed that path."}, {"section": "Overview", "start": "2:45", "kind": "do", "cues": [{"t": "do", "c": "POINT: failure categories"}], "text": "Every failed trial gets a cause from 12 ordered rules, with the evidence attached."}, {"section": "Configs: a refusal", "start": "3:30", "length": "0:45", "kind": "section"}, {"section": "Configs: a refusal", "start": "3:30", "kind": "do", "cues": [{"t": "do", "c": "CLICK: Configs"}], "text": "A config is a harness, a model and its settings. It is immutable: the same settings return the same row, and a change makes a new one."}, {"section": "Configs: a refusal", "start": "3:30", "kind": "do", "cues": [{"t": "do", "c": "SELECT: harness minimal_loop, model openai/gpt-oss-20b"}, {"t": "do", "c": "CLICK: skills enabled"}, {"t": "do", "c": "CLICK: Create"}]}, {"section": "Configs: a refusal", "start": "3:30", "kind": "do", "cues": [{"t": "pause", "c": "PAUSE 2s on the refusal"}], "text": "Refused, with the reason: the minimal loop has no skills. A harness never silently ignores a setting. If it cannot do exactly what the config says, the config is not created, so 2 configs with the same settings always mean the same thing."}, {"section": "Configs: a refusal", "start": "3:30", "kind": "do", "cues": [{"t": "do", "c": "CLEAR the form. Do not create the config."}]}, {"section": "Start the live run, and the pilot", "start": "4:15", "length": "0:45", "kind": "section"}, {"section": "Start the live run, and the pilot", "start": "4:15", "kind": "do", "cues": [{"t": "do", "c": "CLICK: Experiments"}, {"t": "do", "c": "TICK: hermes memory off, hermes memory seeded"}, {"t": "do", "c": "TICK tasks: det-06-ini, mem-05-lint"}, {"t": "do", "c": "SET N: 1"}, {"t": "do", "c": "TYPE the axis and the hypothesis from DEMO_GUIDE 3.7"}], "text": "A live run: 2 tasks, 2 configs, 1 trial each. The hypothesis is required, and it is frozen when I press start."}, {"section": "Start the live run, and the pilot", "start": "4:15", "kind": "do", "cues": [{"t": "do", "c": "CLICK: Create"}, {"t": "do", "c": "CLICK: Start"}], "text": "4 trials, 2 at a time, each in a fresh process. I will come back to it."}, {"section": "Start the live run, and the pilot", "start": "4:15", "kind": "do", "cues": [{"t": "do", "c": "CLICK: the primary experiment, \"P5 primary\""}, {"t": "do", "c": "SCROLL TO: Pilot panel"}], "text": "For the real run I chose N with a pilot. The pilot shows the variance and projected interval widths, and deliberately no difference between configs, so the sample size cannot be steered by the answer. The rule asked for a half-width under 0.15. The measured variance gave 0.084 at 3 trials, so 3 it was."}, {"section": "Compare", "start": "5:00", "length": "1:45", "kind": "section"}, {"section": "Compare", "start": "5:00", "kind": "do", "cues": [{"t": "do", "c": "CLICK: Compare, A = hermes memory off, B = hermes memory seeded"}]}, {"section": "Compare", "start": "5:00", "kind": "do", "cues": [{"t": "do", "c": "POINT: badges"}], "text": "Badges before numbers: reliability complete, judge policy trusted, no rate-limited trials."}, {"section": "Compare", "start": "5:00", "kind": "do", "cues": [{"t": "do", "c": "POINT: axis"}], "text": "It names what differs between A and B: the memory setting, nothing else."}, {"section": "Compare", "start": "5:00", "kind": "do", "cues": [{"t": "do", "c": "POINT: aggregate"}, {"t": "pause", "c": "PAUSE 2s"}], "text": "Delta is A minus B: minus 0.333, interval minus 0.515 to minus 0.167. The interval does not contain zero, so: B better. The minimum detectable effect is 0.174, which is the smallest difference this experiment could have seen."}, {"section": "Compare", "start": "5:00", "kind": "do", "cues": [{"t": "do", "c": "SCROLL TO: category cards"}], "text": "The hypothesis was stated per category, so the statistics are too. Memory-dependent: minus 0.944. The interval is narrow because the 6 tasks agree, not because the effect is known to that precision. Distractors, neutral and honesty: all contain zero, all noise."}, {"section": "Compare", "start": "5:00", "kind": "do", "cues": [{"t": "do", "c": "SCROLL TO: sign test"}], "text": "A second opinion: a sign test over tasks. B won 11, A won 1, 10 tied."}, {"section": "Compare", "start": "5:00", "kind": "do", "cues": [{"t": "do", "c": "SCROLL TO: per-task table"}], "text": "Per task, labelled direction only: 3 trials against 3, no correction. The 0.33 rows outside memory are single trials."}, {"section": "Compare", "start": "5:00", "kind": "do", "cues": [{"t": "do", "c": "SCROLL TO: cost, latency, tokens"}], "text": "Quality next to cost. Memory adds 1,136 tokens to every call, but the memory tasks finish in fewer calls, so per trial seeded was cheaper here. The cost interval contains zero."}, {"section": "A failed trial and its twin", "start": "6:45", "length": "1:00", "kind": "section"}, {"section": "A failed trial and its twin", "start": "6:45", "kind": "do", "cues": [{"t": "do", "c": "SCROLL TO: per-task table, row mem-05-lint"}, {"t": "do", "c": "CLICK: the memory-off trial, 01M5SRTYYFKEFMG9GHK40QFHQQ"}], "text": "A failure under memory off. The task: run the project's lint the way the team runs it. Category: wrong tool usage, with the evidence linked."}, {"section": "A failed trial and its twin", "start": "6:45", "kind": "do", "cues": [{"t": "do", "c": "POINT: the 2 graders"}], "text": "2 graders. The answer: expected FAIL, got PASS. And the mechanism: no shell call ran lint with strict."}, {"section": "A failed trial and its twin", "start": "6:45", "kind": "do", "cues": [{"t": "do", "c": "SCROLL TO: timeline, event 6, then event 9"}], "text": "It read lint.py, which shows a strict mode exists. Then it ran the plain command, got PASS, and reported PASS. The fact that the team runs it strict lives only in memory."}, {"section": "A failed trial and its twin", "start": "6:45", "kind": "do", "cues": [{"t": "do", "c": "CLICK: back"}, {"t": "do", "c": "CLICK: the seeded trial, 01M5SRTYYFKEFMG9GHK40QFHQR"}, {"t": "do", "c": "POINT: event 0"}], "text": "Same task, memory seeded. The memory, loaded by the harness, says: lint is run as python lint.py --strict. 2 steps: it runs strict, gets FAIL, answers FAIL. The only difference between these 2 trials is the memory setting."}, {"section": "The code", "start": "7:45", "length": "1:15", "kind": "section"}, {"section": "The code", "start": "7:45", "kind": "do", "cues": [{"t": "open", "c": "SWITCH TO EDITOR: api/src/stats/compare.ts"}, {"t": "do", "c": "SCROLL TO: noiseRule"}], "text": "3 files carry the idea. First, the noise rule. If the interval contains zero, rounded to 12 decimals, the verdict is noise. There is no minimum effect size and no other test overrides it."}, {"section": "The code", "start": "7:45", "kind": "do", "cues": [{"t": "do", "c": "SCROLL TO: pairedBlock"}], "text": "Above it, the paired block: per-task pass rates for A and B, bootstrapped over tasks with the experiment's stored seed, so the same data always gives the same interval."}, {"section": "The code", "start": "7:45", "kind": "do", "cues": [{"t": "open", "c": "SWITCH TO: worker/adapters/base.py"}, {"t": "do", "c": "SCROLL TO: class HarnessAdapter"}], "text": "Second, the contract. A harness implements 4 methods: validate, prepare, run, collect memory. Validate is what refused the config earlier. Adding a harness is 1 directory and 1 registry line, and the same conformance suite runs over both harnesses."}, {"section": "The code", "start": "7:45", "kind": "do", "cues": [{"t": "open", "c": "SWITCH TO: worker/runner.py"}, {"t": "do", "c": "SCROLL TO: _run_in_dir"}], "text": "Third, isolation. Each trial gets a fresh directory and a fresh child process, running as an unprivileged user. Its copy of the spec has the graders removed, and the runner grades only after the child exits. That is isolation between trials. It is not a sandbox from the host: the network is not controlled."}, {"section": "The design document", "start": "9:00", "length": "0:20", "kind": "section"}, {"section": "The design document", "start": "9:00", "kind": "do", "cues": [{"t": "open", "c": "SWITCH TO EDITOR: DESIGN.md, markdown preview"}, {"t": "do", "c": "SCROLL TO: section 9.7, the N table"}], "text": "The design document carries the reasoning: the N formula and the pilot rule here in section 9.7, the pre-registered hypothesis in 10.1, the measured result in 10.4."}, {"section": "The design document", "start": "9:00", "kind": "do", "cues": [{"t": "do", "c": "SCROLL TO: section 13"}], "text": "And section 13 is the known limits, written before the run, not after."}, {"section": "The live result, and the close", "start": "9:20", "length": "0:30", "kind": "section"}, {"section": "The live result, and the close", "start": "9:20", "kind": "do", "cues": [{"t": "open", "c": "SWITCH TO BROWSER: the live experiment"}, {"t": "do", "c": "CLICK: Compare"}], "text": "The live run finished. mem-05 flipped and det-06 did not. With 2 tasks and 1 trial each, the interval reaches zero, and the platform says noise. The same rule that called the real experiment calls this one too small."}, {"section": "The live result, and the close", "start": "9:20", "kind": "do", "cues": [{"t": "pause", "c": "PAUSE 1s"}], "text": "The limits, because they matter as much as the result: 22 tasks, 3 trials per cell, 1 model, 1 day. The judge is validated against 1 labeler. The memory result holds on tasks written to need memory, and DESIGN section 13 lists the rest."}, {"section": "The live result, and the close", "start": "9:20", "kind": "do", "cues": [{"t": "pause", "c": "PAUSE 1s"}, {"t": "do", "c": "CAMERA, if on"}], "text": "That is the harness I would want around any agent I ship: it tells you what changed, it tells you how sure to be, and it tells you when to stop believing it. Thanks for watching. I'd be glad to walk through any part of it."}, {"section": "The live result, and the close", "start": "9:20", "kind": "do", "cues": [{"t": "do", "c": "STOP RECORDING"}]}];
let i=0,t0=null,run=false,el=0;
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(){const c=CARDS[i];let h='';
 document.getElementById('pos').textContent=(i+1)+' / '+CARDS.length;
 document.getElementById('secname').textContent=c.section;document.getElementById('tstart').textContent=c.start;
 if(c.kind==='section'){h+='<div class="sec">Section · '+c.length+'</div><h1 class="title">'+c.section+'</h1><div class="big">Target start '+c.start+'. Press → when ready.</div>'}
 else{ if(c.cues){const opens=c.cues.filter(x=>x.t==='open'),dos=c.cues.filter(x=>x.t==='do'),ps=c.cues.filter(x=>x.t==='pause');
   if(opens.length)h+='<div class="box open"><div class="lbl">Open / show</div>'+opens.map(x=>'<div class="cue">'+x.c+'</div>').join('')+'</div>';
   if(dos.length)h+='<div class="box do"><div class="lbl">Do</div>'+dos.map(x=>'<div class="cue">'+x.c+'</div>').join('')+'</div>';
   if(ps.length)h+='<div class="pause">'+ps.map(x=>x.c).join(' · ')+'</div>';}
  if(c.text)h+='<div class="box say"><div class="lbl">Say</div><p>'+c.text+'</p></div>';}
 document.getElementById('card').innerHTML=h;}
function tick(){if(run){el=(Date.now()-t0)/1000;const k=document.getElementById('clock');k.textContent=fmt(el);k.className=el>585?'over':''}requestAnimationFrame(tick)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();i=Math.min(i+1,CARDS.length-1);render()}
 else if(e.key==='ArrowLeft'){i=Math.max(i-1,0);render()} else if(e.key==='Home'){i=0;render()}
 else if(e.key.toLowerCase()==='s'){if(!run){t0=Date.now()-el*1000;run=true}else run=false}
 else if(e.key.toLowerCase()==='r'){run=false;el=0;document.getElementById('clock').textContent='00:00'}});
render();tick();
</script></body></html>
